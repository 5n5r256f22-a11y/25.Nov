<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d8d1bd">
  <title>Rosa</title>
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <main class="artwork">
    <img class="background-artwork" src="images/rosa.jpg" alt="A colorful drawing of buildings along a street">
    <img class="bus" src="images/bus.png" alt="" aria-hidden="true">
    <img class="passenger" src="images/passenger.png" alt="" aria-hidden="true">
    <a class="scene-arrow scene-arrow-left" href="new-game.html" aria-label="Open the blank game page"></a>
    <a class="scene-arrow scene-arrow-right" href="new-game.html" aria-label="Open the blank game page"></a>
    <button class="game-start" type="button">Game Start</button>
  </main>
  <section class="cleaning-scene" id="cleaningScene" aria-label="Frosted window cleaning game" hidden>
    <video class="hand-camera" id="handCamera" autoplay playsinline muted aria-hidden="true"></video>
    <button class="exit-game" id="exitGame" type="button">Exit</button>
    <img class="menu-poster-lower-left" src="images/menu-poster.png" alt="Menu poster with plated dishes">
    <aside class="menu-board" aria-label="Attached menu photo">
      <img src="images/menu-board-photo.png" alt="Photograph of a restaurant menu display">
    </aside>
    <canvas class="frost-layer" id="frostCanvas" aria-hidden="true"></canvas>
    <img class="window-frame" src="images/window-frame.svg?v=2" alt="" aria-hidden="true">
    <img class="wipe-cursor" id="wipeCursor" src="images/wiping-hand.svg" alt="" aria-hidden="true" hidden>
    <div class="cleaning-hud">
      <p class="cleaning-status" id="cleaningStatus" role="status" aria-live="polite">Allow camera access, then move your hand left and right to clear the frost.</p>
      <p class="cleaning-privacy">Camera video is processed locally and is not recorded or uploaded.</p>
    </div>
  </section>
  <script src="landing.js"></script>
</body>
</html>
